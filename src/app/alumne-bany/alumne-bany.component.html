<div class="targeta-alumne"> @for (alumne of llistaPendents; track alumne.id_ieducat) {
  <div class="foto">alumne.foto_alum</div>
  <div class="dades">
    <span>{{ alumne.nom_alum }}</span>
    <span>{{ alumne.cog1_alum }}</span>
    <span>{{ alumne.cog2_alum }}</span>
  </div>
  <div>Permís del professor: {{ alumne.permisProfessor ? 'Sí' : 'No' }}</div>
  <div>Susceptible: {{ alumne.susceptible ? 'Sí' : 'No' }}</div>

  <!--
  <div class="hores">
    <span>Hora d'entrada: {{ registreActual?.horaEntrada ?? '—' }}</span>
    <span>Hora de sortida: {{ registreActual?.horaSortida ?? '—' }}</span>
  </div>
  -->

    <button class="sortir" (click)="sortir()">SORTIR</button>
}
</div>
