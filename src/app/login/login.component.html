<div class="login-container">
  <form (ngSubmit)="onSubmit()">
    <input name="gmail" type="email" placeholder="gmail" [(ngModel)]="gmail" required />
    <input name="contrasenya" type="password" placeholder="Contrasenya" [(ngModel)]="contrasenya" required />
    <button type="submit">Entrar</button>
  </form>
</div>
