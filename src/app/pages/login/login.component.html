    <main class="login">
      <form class="panel formulario" (ngSubmit)="entrar()">
        <h1>Entrar al control del baño</h1>
        <div class="campo">
          <label for="login-correo">Correo</label>
          <input id="login-correo" name="correo" type="email" autocomplete="username" [(ngModel)]="correoProfesor">
        </div>
        <div class="campo">
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" name="contrasenya" type="password" autocomplete="current-password" [(ngModel)]="contrasenya">
        </div>
        @if (errorLogin) {
          <p class="msg msg-error" role="alert">{{ errorLogin }}</p>
        }
        <button type="submit" class="btn btn-lima">Entrar</button>
      </form>
    </main>
